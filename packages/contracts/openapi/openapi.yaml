          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Seats.
          content:
            application/json:
              schema:
                $ref: './components/guardians.yaml#/LicenseSeatList'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
  /v1/me/license-purchases:
    post:
      tags: [GuardianLicensing]
      operationId: createPurchaseIntent
      summary: Start an additional-guardian seat purchase (returns store parameters)
      description: Allowed for full sessions and for the limited `guardian.license_purchase` scope.
      parameters:
        - $ref: './components/parameters.yaml#/DeviceId'
        - $ref: './components/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/guardians.yaml#/CreatePurchaseIntentRequest'
      responses:
        '201':
          description: Purchase intent.
          content:
            application/json:
              schema:
                $ref: './components/guardians.yaml#/PurchaseIntent'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          description: FEATURE_NOT_ENTITLED, TENANT_NOT_OPERATIONAL, FORBIDDEN (not primary).
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/Problem'
        '422':
          description: ADDITIONAL_GUARDIAN_LIMIT_REACHED.
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/Problem'
