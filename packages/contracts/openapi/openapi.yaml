  # ───────────────────────────── Display screens ─────────────────────────────
  /v1/display/pairing-sessions:
    post:
      tags: [Displays]
      operationId: createPairingSession
      summary: Start display pairing (shows a code on screen)
      security: []
      x-rate-limit: pairing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components/dismissal.yaml#/CreatePairingSessionRequest'
      responses:
        '201':
          description: Pairing session.
          content:
            application/json:
              schema:
                $ref: './components/dismissal.yaml#/PairingSession'
        '429':
          $ref: './components/responses.yaml#/TooManyRequests'
  /v1/display/pairing-sessions/{pairingSessionId}:
    get:
      tags: [Displays]
      operationId: getPairingSession
      summary: Poll pairing status; returns the display token once after pairing
      security: []
      parameters:
        - name: pairingSessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Pairing-Secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: './components/dismissal.yaml#/PairingSessionStatusResponse'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '429':
          $ref: './components/responses.yaml#/TooManyRequests'
  /v1/display/feed:
    get:
      tags: [Displays]
      operationId: getDisplayFeed
      summary: Privacy-safe queue snapshot for this display
