    post:
      tags: [GuardianLicensing]
      operationId: completePurchase
      summary: Submit the store purchase token for server-side verification
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: './components/parameters.yaml#/DeviceId'
        - $ref: './components/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/guardians.yaml#/CompletePurchaseRequest'
      responses:
        '200':
          description: Verified (seat granted) or pending (state = pending; retry later).
          content:
            application/json:
              schema:
                $ref: './components/guardians.yaml#/PurchaseResult'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
