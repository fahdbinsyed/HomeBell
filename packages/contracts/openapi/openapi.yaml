      x-rate-limit: display-feed
      responses:
        '200':
          description: Feed.
          content:
            application/json:
              schema:
                $ref: './components/dismissal.yaml#/DisplayFeed'
        '401':
          description: DISPLAY_REVOKED or UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/Problem'
        '403':
          description: TENANT_NOT_OPERATIONAL or FEATURE_NOT_ENTITLED.
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/Problem'
