    parameters:
      - $ref: './components/parameters.yaml#/TenantId'
    get:
      tags: [PlatformTenants]
      operationId: platformGetTenant
      summary: Tenant detail with allowed lifecycle actions
      responses:
        '200':
          description: Tenant (ETag header set).
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components/platform.yaml#/TenantDetail'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
    patch:
      tags: [PlatformTenants]
      operationId: platformUpdateTenant
      summary: Update tenant profile
      parameters:
        - $ref: './components/parameters.yaml#/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/platform.yaml#/UpdateTenantRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: './components/platform.yaml#/TenantDetail'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '412':
          $ref: './components/responses.yaml#/PreconditionFailed'
  /v1/platform/tenants/{tenantId}/lifecycle-transitions:
    post:
      tags: [PlatformTenants]
      operationId: platformTransitionTenant
      summary: Apply a lifecycle action (activate, trial, free, override, suspend, deactivate, cancel, offboard, reinstate, extend)
      description: Never processes refunds. `refundStatus` is informational only.
      parameters:
        - $ref: './components/parameters.yaml#/TenantId'
        - $ref: './components/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/platform.yaml#/LifecycleTransitionRequest'
      responses:
        '200':
          description: Transition applied.
          content:
            application/json:
              schema:
                $ref: './components/platform.yaml#/TenantDetail'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '409':
