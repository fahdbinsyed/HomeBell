  # ───────────────────────────── Webhooks (internal) ─────────────────────────────
  /v1/webhooks/google-play:
    post:
      tags: [Webhooks]
      operationId: googlePlayNotification
      summary: Google Play Real-Time Developer Notification (Pub/Sub push)
      description: Observes voided purchases / refunds initiated by Google. HomeBell never initiates refunds.
      x-internal: true
      security:
        - webhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [data, messageId]
                  properties:
                    data:
                      type: string
                      contentEncoding: base64
                    messageId:
                      type: string
                    publishTime:
                      type: string
                      format: date-time
                subscription:
                  type: string
      responses:
        '204':
          $ref: './components/responses.yaml#/NoContent'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
  /v1/webhooks/app-store:
    post:
      tags: [Webhooks]
      operationId: appStoreServerNotification
      summary: Apple App Store Server Notification V2
      description: Observes REFUND / REVOKE and related events initiated by Apple. HomeBell never initiates refunds. Authenticity is proven by verifying the signedPayload JWS chain (no bearer token).
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  type: string
                  description: JWS signed by Apple.
      responses:
        '200':
          description: Accepted.
        '400':
          $ref: './components/responses.yaml#/BadRequest'

