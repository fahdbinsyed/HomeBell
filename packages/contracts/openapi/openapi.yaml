  # ───────────────────────────── Platform: tenants ─────────────────────────────
  /v1/platform/tenants:
    get:
      tags: [PlatformTenants]
      operationId: platformListTenants
      summary: List all tenants
      parameters:
        - $ref: './components/parameters.yaml#/Search'
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: './components/enums.yaml#/TenantLifecycleState'
        - name: planId
          in: query
          schema:
            type: string
            format: uuid
        - name: flag
          in: query
          schema:
            $ref: './components/platform.yaml#/TenantFlag'
        - name: expiringBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, createdAt, expiresAt, lastActivityAt]
            default: name
        - name: direction
          in: query
          schema:
            $ref: './components/enums.yaml#/SortDirection'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Tenants page.
          content:
            application/json:
              schema:
                $ref: './components/platform.yaml#/TenantPage'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
    post:
      tags: [PlatformTenants]
      operationId: platformCreateTenant
      summary: Create a school tenant
      parameters:
        - $ref: './components/parameters.yaml#/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/platform.yaml#/CreateTenantRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './components/platform.yaml#/TenantDetail'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '409':
          description: TENANT_SLUG_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: './components/common.yaml#/Problem'
