TenantId:
  name: tenantId
  in: path
  required: true
  description: Tenant (school) ID. Validated against the caller's scope; foreign tenants return 404.
  schema:
    type: string
    format: uuid
Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor from a previous page's `nextCursor`.
  schema:
    type: string
    maxLength: 512
Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25
Search:
  name: q
  in: query
  required: false
  description: Free-text search (name, external ref, phone suffix).
  schema:
    type: string
    maxLength: 100
From:
  name: from
  in: query
  required: false
  description: Inclusive lower bound (tenant-local date).
  schema:
    type: string
    format: date
To:
  name: to
  in: query
  required: false
  description: Inclusive upper bound (tenant-local date).
  schema:
    type: string
    format: date
QueueDate:
  name: queueDate
  in: query
  required: false
  description: Tenant-local queue date. Defaults to today in the tenant timezone.
  schema:
    type: string
    format: date
AfterSeq:
  name: afterSeq
  in: query
  required: true
  description: Return events with seq strictly greater than this value.
  schema:
    type: integer
    format: int64
    minimum: 0
Format:
  name: format
  in: query
  required: false
  description: json (default) or csv export. CSV requires `reports.export`.
  schema:
    type: string
    enum: [json, csv]
    default: json
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: >-
    Unique per user intent (UUID recommended). Same key + same body replays the original response
    (header Idempotent-Replayed: true); same key + different body → 422 IDEMPOTENCY_KEY_REUSED.
    Retained 24 h.
  schema:
    type: string
    minLength: 8
    maxLength: 128
DeviceId:
  name: X-Device-Id
  in: header
  required: true
  description: App install ID (UUID) stored in secure storage. Required on all guardian-app requests.
  schema:
    type: string
    format: uuid
DeviceIdOptional:
  name: X-Device-Id
  in: header
  required: false
  schema:
    type: string
    format: uuid
IfMatch:
  name: If-Match
  in: header
  required: false
  description: ETag from a previous GET. If it no longer matches → 412 PRECONDITION_FAILED.
  schema:
    type: string
StudentIdPath:
  name: studentId
  in: path
  required: true
  schema:
    type: string
    format: uuid
GuardianIdPath:
  name: guardianId
  in: path
  required: true
  schema:
    type: string
    format: uuid
PickupRequestIdPath:
  name: requestId
  in: path
  required: true
  schema:
    type: string
    format: uuid
