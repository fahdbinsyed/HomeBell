    Problem:
      type: object
      description: RFC 9457 problem details with HomeBell extensions. Content type application/problem+json.
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
          description: https://docs.homebell.app/errors/{code-in-kebab-case}
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable, not for programmatic matching. Use `code`.
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: string
        errors:
          type: array
          description: Present when code = VALIDATION_FAILED.
          items:
            $ref: '#/components/schemas/FieldError'
        meta:
          type: object
          description: Code-specific machine-readable details, e.g. retryAfterSeconds, lockedUntil, cooldownEndsAt, remainingAttempts, existingRequestId, currentState, limit, operationalMode.
          additionalProperties: true
    Email:
      type: string
      format: email
      maxLength: 254
    StaffLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        audience:
          type: string
          enum:
            - school
            - platform
          description: Which web app is signing in. Platform audience requires a platform role and MFA.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
      example: '2026-11-23T14:31:07Z'
    Uuid:
      type: string
      format: uuid
      example: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5a6b
    TokenPair:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - sessionId
        - scope
      properties:
        accessToken:
          type: string
          description: JWT, ~10 min. Web BFF keeps it server-side; mobile keeps it in secure storage.
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        refreshToken:
          type: string
          description: Opaque, rotated on every use. Reuse of a rotated token revokes the session.
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        scope:
          $ref: '#/components/schemas/SessionScope'
    IanaTimezone:
      type: string
      maxLength: 64
      example: America/New_York
    TenantMembershipSummary:
      type: object
      required:
        - membershipId
        - tenantId
        - tenantName
        - role
        - permissions
        - tenantState
        - operationalMode
      properties:
        membershipId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        tenantName:
          type: string
        tenantSlug:
          type: string
        role:
          $ref: '#/components/schemas/SchoolRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        tenantState:
          $ref: '#/components/schemas/TenantLifecycleState'
        operationalMode:
          $ref: '#/components/schemas/OperationalMode'
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
    GuardianProfileSummary:
      type: object
      required:
        - guardianId
        - tenantId
        - tenantName
        - kind
        - state
        - operationalMode
      properties:
        guardianId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        tenantName:
          type: string
        kind:
          $ref: '#/components/schemas/GuardianKind'
        state:
          $ref: '#/components/schemas/GuardianState'
        operationalMode:
          $ref: '#/components/schemas/OperationalMode'
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
    Me:
      type: object
      required:
        - userId
