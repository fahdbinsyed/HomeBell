          $ref: '#/components/schemas/DevicePlatform'
        model:
          type: string
          maxLength: 100
        osVersion:
          type: string
          maxLength: 50
        appVersion:
          type: string
          maxLength: 50
    OtpVerifyRequest:
      type: object
      required:
        - challengeId
        - code
        - device
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^\d{6}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
