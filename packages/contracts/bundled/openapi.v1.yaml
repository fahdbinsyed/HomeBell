                - endOfDayTime
              properties:
                sentOutReminderMinutes:
                  type: integer
                  minimum: 1
                  maximum: 30
                sentOutExceptionMinutes:
                  type: integer
                  minimum: 5
                  maximum: 60
                requestedStaleMinutes:
                  type: integer
                  minimum: 10
                  maximum: 120
                endOfDayTime:
                  $ref: '#/components/schemas/LocalTime'
