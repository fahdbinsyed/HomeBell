openapi: 3.1.0
info:
  title: HomeBell API
  version: 1.2.0
  summary: Multi-tenant school pickup and dismissal platform.
  description: |
    HomeBell API v1 — the single source of truth for frontend and backend (ADR-0004).

    **Planes**
    - `/v1/platform/**` — control plane (platform owner / super admin portal).
    - `/v1/t/{tenantId}/**` — tenant plane for school staff.
    - `/v1/me/**` — guardian self-service (aggregated across the guardian's schools).
    - `/v1/display/**` — public display screens (display token).
    - `/v1/auth/**`, `/v1/invitations/**` — authentication and invitation redemption.

    **Conventions**
    - JSON, camelCase, UUID ids, RFC 3339 UTC timestamps; tenant-local dates where noted.
    - Errors: `application/problem+json` (RFC 9457) with a machine-readable `code` (`ErrorCode`).
    - Pagination: `cursor` + `limit` → `{ items, nextCursor, limit }`.
    - `Idempotency-Key` header on retry-prone writes (documented per operation).
    - `If-Match` (ETag) optional on PATCH/PUT of mutable admin resources.
    - Guardian app requests always send `X-Device-Id`.
    - Foreign or unknown tenant resources return 404, never 403.
    - Clients must tolerate unknown enum values.

    HomeBell supports safer dismissal and clearer accountability. The MVP does **not** perform
    identity-verified physical handoff and does **not** process refunds.
  contact:
    name: neuXplus — HomeBell engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:5080
    description: Local development API
  - url: '{baseUrl}'
    description: Deployed environment
    variables:
      baseUrl:
        default: https://api.homebell.invalid
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Staff/platform sign-in, guardian OTP sign-in, sessions, device transfer.
  - name: Invitations
    description: Additional guardian invitation redemption (unauthenticated).
  - name: Guardian
    description: Guardian self-service (mobile app).
  - name: GuardianLicensing
    description: Additional guardian seats, purchases and invitations (primary guardian).
  - name: SchoolOverview
    description: School dashboard overview, entitlements, subscription view, settings.
  - name: Classes
    description: Classes and sections.
  - name: Students
    description: Student management and imports.
  - name: Guardians
    description: School-side guardian management, blocking, device visibility.
  - name: Staff
    description: School staff and roles.
  - name: Queue
    description: Live dismissal queue and pickup request operations (staff).
  - name: Displays
    description: Display screen pairing (school) and display feed (display token).
  - name: Reports
    description: Reports and tenant audit log.
  - name: PlatformTenants
    description: Tenant lifecycle, subscriptions, entitlements, usage, notes.
  - name: PlatformCatalog
    description: Plans, plan versions, feature flags.
  - name: PlatformOps
    description: Platform users, audit, support sessions, cross-tenant device oversight.
  - name: Webhooks
    description: Provider callbacks (internal).
paths:
  /v1/auth/staff/login:
    post:
      tags:
        - Auth
      operationId: staffLogin
      summary: Staff or platform user sign-in (email + password)
      security: []
      x-rate-limit: auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Authenticated, or MFA step required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: ACCOUNT_LOCKED or ACCOUNT_DEACTIVATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/staff/mfa/verify:
    post:
      tags:
        - Auth
      operationId: staffMfaVerify
      summary: Complete sign-in with a TOTP or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginAuthenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/staff/mfa/enroll:
    post:
      tags:
        - Auth
      operationId: staffMfaEnrollStart
      summary: Start TOTP enrollment (required for platform users)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollStartRequest'
      responses:
        '200':
          description: TOTP secret issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/staff/mfa/enroll/confirm:
    post:
      tags:
        - Auth
      operationId: staffMfaEnrollConfirm
      summary: Confirm TOTP enrollment and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollConfirmRequest'
      responses:
        '200':
          description: Enrolled and authenticated. Recovery codes are shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollConfirmResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/staff/password/forgot:
    post:
      tags:
        - Auth
      operationId: staffPasswordForgot
      summary: Request a password reset email (always 204)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/staff/password/reset:
    post:
      tags:
        - Auth
      operationId: staffPasswordReset
      summary: Reset password with an emailed token (revokes all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/staff/invitations/preview:
    post:
      tags:
        - Auth
      operationId: staffInvitationPreview
      summary: Preview a staff invitation (token in body, never in URL)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Invitation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/staff/invitations/accept:
    post:
      tags:
        - Auth
      operationId: staffInvitationAccept
      summary: Accept a staff/platform invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInvitationAcceptRequest'
      responses:
        '200':
          description: Membership created; sign-in result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_CREDENTIALS — an existing account accepted with the wrong password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/otp/send:
    post:
      tags:
        - Auth
      operationId: otpSend
      summary: Send an OTP to a guardian phone (anti-enumeration — same response for unknown phones)
      security: []
      x-rate-limit: otp-send
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '202':
          description: Challenge created (SMS dispatched asynchronously).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: PHONE_NOT_SUPPORTED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: OTP_TEMPORARILY_UNAVAILABLE (provider down or budget breaker open).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/otp/resend:
    post:
      tags:
        - Auth
      operationId: otpResend
      summary: Resend the code for an existing challenge
      security: []
      x-rate-limit: otp-send
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: Code re-sent; challenge updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServerError'
  /v1/auth/otp/verify:
    post:
      tags:
        - Auth
      operationId: otpVerify
      summary: Verify a guardian OTP — signs in, reports a device conflict, or reports no account
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Verification outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: OTP_CHALLENGE_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: OTP_EXPIRED or OTP_ATTEMPTS_EXCEEDED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: OTP_INVALID (`meta.remainingAttempts`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: OTP_LOCKED (`meta.lockedUntil`) or RATE_LIMITED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/device-transfer:
    post:
      tags:
        - Auth
      operationId: deviceTransfer
      summary: Transfer the account to this device (revokes the old device's sessions)
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConflictTokenRequest'
      responses:
        '200':
          description: Transferred and signed in on this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTransferResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: DEVICE_CONFLICT_TOKEN_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: DEVICE_TRANSFER_COOLDOWN (`meta.cooldownEndsAt`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/device-conflict/limited-session:
    post:
      tags:
        - Auth
      operationId: deviceConflictLimitedSession
      summary: Get a limited session on the new device that can only buy a seat and invite another person
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConflictTokenRequest'
      responses:
        '200':
          description: Limited session (scope guardian.license_purchase, 30 min).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FEATURE_NOT_ENTITLED or FORBIDDEN (not a primary guardian).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshTokens
      summary: Rotate the refresh token and get a new access token
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: REFRESH_TOKEN_INVALID, REFRESH_TOKEN_REUSED, SESSION_REVOKED, DEVICE_REVOKED or DEVICE_MISMATCH.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Revoke the current session
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getMe
      summary: Current identity, roles, memberships and guardian profiles
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/realtime-tickets:
    post:
      tags:
        - Auth
      operationId: createRealtimeTicket
      summary: Mint a single-use 60-second ticket for connecting to a SignalR hub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketRequest'
      responses:
        '200':
          description: Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/invitations/lookup:
    post:
      tags:
        - Invitations
      operationId: lookupInvitation
      summary: Look up an invitation by code (masked preview only)
      security: []
      x-rate-limit: invitation-lookup
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationLookupRequest'
      responses:
        '200':
          description: Invitation preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: INVITATION_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: INVITATION_EXPIRED, INVITATION_ALREADY_USED or INVITATION_REVOKED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invitations/{invitationId}/otp:
    post:
      tags:
        - Invitations
      operationId: sendInvitationOtp
      summary: Confirm the invited phone number and send an OTP to it
      security: []
      x-rate-limit: otp-send
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationOtpRequest'
      responses:
        '202':
          description: OTP sent to the invited number only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          description: INVITATION_PHONE_MISMATCH.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invitations/{invitationId}/redeem:
    post:
      tags:
        - Invitations
      operationId: redeemInvitation
      summary: Verify the OTP and redeem the invitation (creates or links a separate guardian account)
      security: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRedeemRequest'
      responses:
        '200':
          description: Redeemed. Outcome is `authenticated`, or `device_conflict` if this account is active on another device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/profile:
    get:
      tags:
        - Guardian
      operationId: getMyProfile
      summary: Guardian profile
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Guardian
      operationId: updateMyProfile
      summary: Update display name or locale
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianProfileUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/terms-acceptance:
    post:
      tags:
        - Guardian
      operationId: acceptTerms
      summary: Record acceptance of the current terms and privacy notice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptanceRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/children:
    get:
      tags:
        - Guardian
      operationId: listMyChildren
      summary: Linked children across schools, with pickup eligibility and active request
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Children and per-school context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/pickup-requests:
    get:
      tags:
        - Guardian
      operationId: listMyPickupRequests
      summary: Pickup request history
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianPickupRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Guardian
      operationId: createPickupRequest
      summary: Request pickup for one or more linked children
      description: |
        Creates one request per student. Ineligible students are reported in `rejected` with codes such as
        GUARDIAN_BLOCKED, GUARDIAN_ACCESS_EXPIRED, STUDENT_NOT_ELIGIBLE, OUTSIDE_DISMISSAL_WINDOW,
        LOCATION_REQUIRED, OUTSIDE_PICKUP_ZONE, DUPLICATE_ACTIVE_REQUEST. If *every* student is rejected for
        a guardian/tenant-level reason, the whole call fails with that error instead.
      x-rate-limit: guardian-write
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePickupRequest'
      responses:
        '201':
          description: Requests created (possibly with some rejected students).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePickupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: GUARDIAN_BLOCKED, GUARDIAN_DEACTIVATED, GUARDIAN_ACCESS_EXPIRED, TENANT_NOT_OPERATIONAL, FEATURE_NOT_ENTITLED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: IDEMPOTENCY_IN_PROGRESS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: All students rejected (see `meta.rejected`), or IDEMPOTENCY_KEY_REUSED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/pickup-requests/{requestId}:
    get:
      tags:
        - Guardian
      operationId: getMyPickupRequest
      summary: One of my pickup requests
      parameters:
        - $ref: '#/components/parameters/PickupRequestIdPath'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianPickupRequest'
        '400':
