        status:
          type: string
          enum:
            - mfa_enrollment_required
        enrollmentToken:
          type: string
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    StaffLoginResult:
      oneOf:
        - $ref: '#/components/schemas/StaffLoginAuthenticated'
        - $ref: '#/components/schemas/StaffLoginMfaRequired'
        - $ref: '#/components/schemas/StaffLoginMfaEnrollmentRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/StaffLoginAuthenticated'
          mfa_required: '#/components/schemas/StaffLoginMfaRequired'
          mfa_enrollment_required: '#/components/schemas/StaffLoginMfaEnrollmentRequired'
    FieldError:
      type: object
