          $ref: '#/components/schemas/Uuid'
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        model:
          type: string
        state:
          $ref: '#/components/schemas/DeviceState'
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
    DeviceConflict:
