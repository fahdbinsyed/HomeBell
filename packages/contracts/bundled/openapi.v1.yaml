      type: object
      required:
        - mode
      description: permanent → no extra fields; temporary → durationDays (1–30); valid_until_date → validUntil (≤ seat term end); one_time → no extra fields (ends at first acknowledged pickup or 24 h).
      properties:
        mode:
          $ref: '#/components/schemas/LicenseValidityMode'
        durationDays:
          type: integer
          minimum: 1
          maximum: 30
        validUntil:
