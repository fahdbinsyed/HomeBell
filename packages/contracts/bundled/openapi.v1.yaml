            - integer
            - 'null'
        source:
          $ref: '#/components/schemas/EntitlementSource'
        overrideId:
          type:
            - string
            - 'null'
          format: uuid
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    EffectiveEntitlements:
      type: object
