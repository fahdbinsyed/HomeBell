        - guardianId
        - tenantId
        - fullName
        - maskedPhone
        - relationship
        - state
        - students
        - validity
        - seatId
      properties:
        guardianId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: string
        maskedPhone:
          $ref: '#/components/schemas/MaskedPhone'
        relationship:
          $ref: '#/components/schemas/Relationship'
        state:
          $ref: '#/components/schemas/GuardianState'
        students:
          type: array
          items:
            type: object
            required:
              - studentId
