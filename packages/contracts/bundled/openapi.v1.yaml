          $ref: '#/components/schemas/TokenPair'
        me:
          $ref: '#/components/schemas/Me'
        activatedProfiles:
          type: array
          description: Guardian profiles that moved from pending_activation to active during this verification.
          items:
            $ref: '#/components/schemas/GuardianProfileSummary'
    DeviceSummary:
      type: object
      required:
        - deviceId
        - platform
        - model
        - state
