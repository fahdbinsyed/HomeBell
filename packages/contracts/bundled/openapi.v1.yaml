        session:
          type: object
          required:
            - id
            - kind
            - scope
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            kind:
              $ref: '#/components/schemas/SessionKind'
            scope:
              $ref: '#/components/schemas/SessionScope'
            deviceId:
              type:
                - string
                - 'null'
              format: uuid
            supportTenantId:
