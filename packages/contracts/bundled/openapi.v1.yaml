        - role
        - expiresAt
        - accountExists
      properties:
        email:
          $ref: '#/components/schemas/Email'
        tenantName:
          type: string
        role:
          $ref: '#/components/schemas/SchoolRole'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        accountExists:
          type: boolean
          description: If true, the invitee signs in with their existing password instead of setting one.
    PersonName:
      type: string
      minLength: 1
      maxLength: 120
    StaffInvitationAcceptRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
        fullName:
          $ref: '#/components/schemas/PersonName'
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: Required when the account does not exist yet.
    PhoneE164:
      type: string
      pattern: ^\+[1-9]\d{6,14}$
      example: '+15551234567'
    OtpSendRequest:
      type: object
      required:
        - phone
        - purpose
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        purpose:
          type: string
          enum:
            - login
            - suspicious_login
            - recovery
          description: Invitation redemption uses /v1/invitations/{id}/otp; device transfer reuses the login OTP via conflictToken.
    MaskedPhone:
      type: string
      description: Country code + last 4 digits, e.g. "+1•••••4567".
      example: +1•••••4567
    OtpChallenge:
      type: object
      required:
        - challengeId
        - purpose
        - channel
        - maskedPhone
        - expiresAt
        - resendAvailableAt
        - remainingSends
      description: Returned identically whether or not the phone is registered (anti-enumeration).
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          $ref: '#/components/schemas/OtpChannel'
        maskedPhone:
          $ref: '#/components/schemas/MaskedPhone'
        codeLength:
          type: integer
          enum:
            - 6
          default: 6
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        resendAvailableAt:
          $ref: '#/components/schemas/Timestamp'
        remainingSends:
          type: integer
          minimum: 0
          description: Sends left in the current window.
    OtpResendRequest:
      type: object
      required:
        - challengeId
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
