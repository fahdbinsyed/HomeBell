      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseSeat'
    CreatePurchaseIntentRequest:
      type: object
      required:
        - tenantId
        - provider
      properties:
        tenantId:
          $ref: '#/components/schemas/Uuid'
        provider:
          $ref: '#/components/schemas/BillingProvider'
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Amount in minor units (cents).
        currency:
          $ref: '#/components/schemas/Currency'
    PurchaseIntent:
      type: object
      description: Store parameters for one purchase. Google Play uses obfuscatedAccountId/obfuscatedProfileId; Apple StoreKit 2 uses appAccountToken.
      required:
        - intentId
        - provider
        - productId
        - expiresAt
      properties:
        intentId:
          $ref: '#/components/schemas/Uuid'
        provider:
          $ref: '#/components/schemas/BillingProvider'
        productId:
          type: string
          example: guardian_seat_term
        obfuscatedAccountId:
          type:
            - string
            - 'null'
          description: Google Play — pass to BillingFlowParams; binds the purchase to this account.
        obfuscatedProfileId:
          type:
            - string
            - 'null'
          description: Google Play — pass to BillingFlowParams; binds the purchase to this intent.
        appAccountToken:
          type:
            - string
            - 'null'
          format: uuid
          description: Apple StoreKit 2 — pass as the purchase option appAccountToken; binds the transaction to this intent.
        displayPrice:
          description: Informational; the store sheet shows the authoritative localized price.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        seatTermEndsAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    CompletePurchaseRequest:
      type: object
      required:
        - purchaseToken
        - productId
      properties:
        purchaseToken:
          type: string
          maxLength: 16384
          description: Google Play purchaseToken, or the Apple StoreKit 2 signed transaction (JWS).
        productId:
          type: string
        orderId:
          type: string
          description: Google Play orderId or Apple transactionId (informational; the server verifies with the store).
    PurchaseResult:
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/PurchaseState'
        seat:
          oneOf:
            - $ref: '#/components/schemas/LicenseSeat'
            - type: 'null'
    InvitationStatus:
      type: object
      required:
        - id
        - state
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/InvitationState'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        redeemedAt:
          type:
            - string
            - 'null'
          format: date-time
    AdditionalGuardian:
