          type: object
          required:
            - enabled
            - radiusMeters
            - maxAccuracyMeters
          properties:
            enabled:
              type: boolean
              description: Requires feature dismissal.location_rule.
            center:
              oneOf:
                - $ref: '#/components/schemas/GeoPoint'
                - type: 'null'
            radiusMeters:
              type: integer
              minimum: 50
              maximum: 5000
            maxAccuracyMeters:
              type: integer
              minimum: 10
              maximum: 1000
        display:
          type: object
          required:
            - nameFormat
            - showClass
            - showSection
            - theme
          properties:
            nameFormat:
              $ref: '#/components/schemas/DisplayNameFormat'
            showClass:
              type: boolean
            showSection:
              type: boolean
            theme:
              type: string
              enum:
                - light
                - dark
                - auto
