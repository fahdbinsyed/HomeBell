          $ref: '#/components/responses/NotFound'
  /v1/webhooks/google-play:
    post:
      tags:
        - Webhooks
      operationId: googlePlayNotification
      summary: Google Play Real-Time Developer Notification (Pub/Sub push)
      description: Observes voided purchases / refunds initiated by Google. HomeBell never initiates refunds.
      x-internal: true
      security:
        - webhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: object
                  required:
                    - data
                    - messageId
                  properties:
                    data:
                      type: string
                      contentEncoding: base64
                    messageId:
                      type: string
                    publishTime:
                      type: string
                      format: date-time
                subscription:
                  type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/webhooks/app-store:
    post:
      tags:
        - Webhooks
      operationId: appStoreServerNotification
      summary: Apple App Store Server Notification V2
      description: Observes REFUND / REVOKE and related events initiated by Apple. HomeBell never initiates refunds. Authenticity is proven by verifying the signedPayload JWS chain (no bearer token).
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signedPayload
              properties:
                signedPayload:
                  type: string
                  description: JWS signed by Apple.
      responses:
        '200':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    TenantLifecycleState:
      type: string
      enum:
        - draft
        - trial
        - pilot_free
        - active_paid
        - manual_override
        - suspended
        - deactivated
        - cancelled
        - offboarding
        - expired
    TenantLifecycleAction:
      type: string
      enum:
        - activate
        - start_trial
        - convert_to_paid
        - grant_free
        - apply_manual_override
        - extend_expiry
        - suspend
        - deactivate
        - cancel
        - start_offboarding
        - reinstate
    OperationalMode:
      type: string
      description: Derived from lifecycle state. full = normal operation.
      enum:
        - setup
        - full
        - read_only
        - blocked
        - export_only
    LifecycleReasonCode:
      type: string
      enum:
        - contract_signed
        - trial_requested
        - renewal
        - pilot_program
        - charity
        - non_payment
        - school_request
        - policy_violation
        - security_incident
        - operational_error
        - data_request
        - other
    RefundStatus:
      type: string
      description: Informational only. HomeBell never processes refunds; refunds are handled manually outside the application.
      enum:
        - none
        - refund_requested
        - refund_handled_manually
        - no_refund_due
    DataPlacement:
      type: string
      enum:
        - shared
        - dedicated
    PlanVersionStatus:
      type: string
      enum:
        - draft
        - published
        - retired
    BillingPeriod:
      type: string
      enum:
        - annual
    Currency:
      type: string
      enum:
        - USD
    EntitlementKind:
      type: string
      enum:
        - feature
        - limit
    EntitlementSource:
      type: string
      enum:
        - plan
        - override
        - lifecycle
        - flag
        - default
    FeatureKey:
      type: string
      enum:
        - dismissal.queue
        - dismissal.display
        - dismissal.location_rule
        - dismissal.sent_out_step
        - guardians.additional_purchase
        - guardians.school_granted_seats
        - imports.csv
        - reports.standard
        - reports.export
        - branding.custom
        - audio.announcements
        - qr.verification
        - campus.multi
        - sso.enterprise
    LimitKey:
      type: string
      enum:
        - students.max
        - staff.max
        - displays.max
        - additional_guardians.max_per_student
        - otp.daily_budget
        - imports.max_rows
    NoteCategory:
      type: string
      enum:
        - general
        - billing
        - refund
        - support
        - lifecycle
        - security
    PlatformRole:
      type: string
      enum:
        - platform.super_admin
        - platform.ops_admin
        - platform.billing_ops
        - platform.support_analyst
    SchoolRole:
      type: string
      enum:
        - school.admin
        - school.dispatcher
        - school.front_desk
        - school.reporting
    GuardianRole:
      type: string
      enum:
        - guardian.primary
        - guardian.additional
    Permission:
      type: string
      description: Fine-grained permission. UIs may use these to hide actions; the server is the only enforcement point.
      enum:
        - platform.tenants.read
        - platform.tenants.write
        - platform.lifecycle.write
        - platform.plans.read
        - platform.plans.write
        - platform.subscriptions.write
        - platform.overrides.write
        - platform.flags.write
        - platform.notes.read
        - platform.notes.write
        - platform.audit.read
        - platform.users.manage
        - platform.support_sessions.create
        - platform.devices.override
        - school.settings.read
        - school.settings.write
        - school.staff.manage
        - school.students.read
        - school.students.write
        - school.imports.write
        - school.guardians.read
        - school.guardians.write
        - school.guardians.block
        - school.devices.override
        - school.displays.manage
        - school.queue.read
        - school.queue.dispatch
        - school.queue.resolve
        - school.reports.read
        - school.reports.export
        - school.audit.read
        - school.subscription.read
    MembershipState:
      type: string
      enum:
        - invited
        - active
        - deactivated
    SessionKind:
      type: string
      enum:
        - staff
        - platform
        - guardian
        - display
        - support
    SessionScope:
      type: string
      enum:
        - full
        - guardian.license_purchase
        - support.read_only
    SessionRevokeReason:
      type: string
      enum:
        - logout
        - device_transfer
        - admin_action
        - refresh_reuse
        - account_deactivated
        - tenant_blocked
        - password_reset
        - expired
    OtpPurpose:
      type: string
      enum:
        - login
        - invitation_redeem
        - device_transfer
        - suspicious_login
        - recovery
        - phone_change
    OtpChannel:
      type: string
      enum:
        - sms
    DevicePlatform:
      type: string
      enum:
        - android
        - ios
    DeviceState:
      type: string
      enum:
        - active
        - revoked
        - transferred_out
    CooldownOverrideReason:
      type: string
      enum:
        - lost_device
        - stolen_device
        - device_replaced
        - other
    StudentStatus:
      type: string
      enum:
        - active
        - inactive
    DismissalEligibility:
      type: string
      description: eligible = normal; hold = temporarily held by school (pickup blocked); not_eligible = e.g. bus-only.
      enum:
        - eligible
        - hold
        - not_eligible
    GuardianKind:
      type: string
      enum:
        - primary
        - additional
    GuardianState:
      type: string
      enum:
        - pending_activation
        - active
        - blocked
        - deactivated
        - revoked
        - expired
    Relationship:
      type: string
      enum:
        - mother
        - father
        - parent
        - step_parent
        - legal_guardian
        - grandparent
        - sibling
        - aunt_uncle
        - spouse
        - driver
        - nanny
        - family_friend
        - other
    InvitationState:
      type: string
      enum:
        - pending
        - redeemed
        - expired
        - revoked
    LicenseSeatState:
      type: string
      enum:
        - available
        - assigned
        - expired
        - voided
    LicenseSeatSource:
      type: string
      enum:
        - purchase
        - school_grant
        - platform_grant
    LicenseValidityMode:
      type: string
      description: See ADR-0011.
      enum:
        - permanent
        - temporary
        - valid_until_date
        - one_time
    PickupRequestState:
      type: string
      enum:
        - requested
        - sent_out
        - acknowledged
        - cancelled
        - exception
        - resolved
    PickupResolution:
      type: string
      enum:
        - guardian_confirmed_offline
        - staff_confirmed_handoff
        - student_not_collected
        - request_in_error
        - other
    PickupActorType:
      type: string
      enum:
