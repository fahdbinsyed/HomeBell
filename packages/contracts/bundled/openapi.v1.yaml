      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        me:
          $ref: '#/components/schemas/Me'
        recoveryCodes:
          type: array
          description: Shown once.
          items:
            type: string
    PasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/Email'
    PasswordResetRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
    StaffInvitationPreview:
      type: object
      required:
