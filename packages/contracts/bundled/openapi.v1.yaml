        - message
      properties:
        field:
          type: string
          description: JSON pointer-ish path, e.g. "students[2].phone".
        code:
          type: string
          description: Validation rule identifier, e.g. "required", "max_length", "invalid_format".
        message:
          type: string
    MfaVerifyRequest:
      type: object
      required:
        - mfaToken
        - code
      properties:
        mfaToken:
          type: string
        code:
          type: string
          pattern: ^(\d{6}|[A-Z0-9]{4}-[A-Z0-9]{4})$
          description: 6-digit TOTP code or a recovery code.
    MfaEnrollStartRequest:
      type: object
      required:
        - enrollmentToken
      properties:
        enrollmentToken:
          type: string
