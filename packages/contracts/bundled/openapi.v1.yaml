    PlatformDeviceTransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlatformDeviceTransfer'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for staff, platform, guardian and support sessions.
    displayAuth:
      type: http
      scheme: bearer
      description: Opaque display token from pairing (scope display:read).
    webhookAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token from the Pub/Sub push subscription.
  responses:
    BadRequest:
      description: Validation failed (VALIDATION_FAILED), malformed request (BAD_REQUEST) or missing X-Device-Id on guardian endpoints (DEVICE_ID_REQUIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: UNAUTHENTICATED, TOKEN_EXPIRED, SESSION_REVOKED, DEVICE_REVOKED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: RATE_LIMITED or OTP limit codes. `Retry-After` header and `meta.retryAfterSeconds` are set.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Success, no body.
    Gone:
      description: Resource expired or no longer available (e.g. QUEUE_CATCHUP_GAP_TOO_LARGE, INVITATION_EXPIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not in caller's scope (NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: INTERNAL_ERROR or SERVICE_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule rejected the request; see `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict; see `code` (e.g. DUPLICATE_ACTIVE_REQUEST, INVALID_PICKUP_TRANSITION, IDEMPOTENCY_IN_PROGRESS).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: FORBIDDEN, SCOPE_INSUFFICIENT, FEATURE_NOT_ENTITLED, TENANT_NOT_OPERATIONAL, TENANT_READ_ONLY.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match ETag mismatch (PRECONDITION_FAILED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: App install ID (UUID) stored in secure storage. Required on all guardian-app requests.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Unique per user intent (UUID recommended). Same key + same body replays the original response (header Idempotent-Replayed: true); same key + different body → 422 IDEMPOTENCY_KEY_REUSED. Retained 24 h.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DeviceIdOptional:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower bound (tenant-local date).
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: false
      description: Inclusive upper bound (tenant-local date).
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PickupRequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuardianIdPath:
      name: guardianId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant (school) ID. Validated against the caller's scope; foreign tenants return 404.
      schema:
        type: string
        format: uuid
    QueueDate:
      name: queueDate
      in: query
      required: false
      description: Tenant-local queue date. Defaults to today in the tenant timezone.
      schema:
        type: string
        format: date
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from a previous GET. If it no longer matches → 412 PRECONDITION_FAILED.
      schema:
        type: string
    Search:
      name: q
      in: query
      required: false
      description: Free-text search (name, external ref, phone suffix).
      schema:
        type: string
        maxLength: 100
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AfterSeq:
      name: afterSeq
      in: query
      required: true
      description: Return events with seq strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
    Format:
      name: format
      in: query
      required: false
      description: json (default) or csv export. CSV requires `reports.export`.
      schema:
        type: string
        enum:
          - json
          - csv
        default: json
