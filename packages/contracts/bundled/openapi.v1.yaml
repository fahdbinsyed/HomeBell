        platformRoles:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRole'
        platformPermissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembershipSummary'
        guardianProfiles:
          type: array
          items:
            $ref: '#/components/schemas/GuardianProfileSummary'
        termsAcceptanceRequired:
          type: boolean
        currentTermsVersion:
          type: string
    StaffLoginAuthenticated:
