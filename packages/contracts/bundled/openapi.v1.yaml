          type: object
          required:
            - displayName
          properties:
            displayName:
              type: string
              maxLength: 120
            logoUrl:
              type:
                - string
                - 'null'
              format: uri
            primaryColor:
              type:
                - string
                - 'null'
              pattern: ^#[0-9A-Fa-f]{6}$
        notifications:
