        - expiresAt
      properties:
        status:
          type: string
          enum:
            - mfa_required
        mfaToken:
          type: string
          description: Short-lived (5 min) proof that the password step succeeded.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    StaffLoginMfaEnrollmentRequired:
      type: object
      required:
        - status
