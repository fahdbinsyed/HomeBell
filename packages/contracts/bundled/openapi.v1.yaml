          type: string
    MfaEnrollConfirmRequest:
      type: object
      required:
        - enrollmentToken
        - enrollmentId
        - code
      properties:
        enrollmentToken:
          type: string
        enrollmentId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^\d{6}$
    MfaEnrollConfirmResult:
      type: object
      required:
        - tokens
