name: HomeBell quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ci-disposable-database
          POSTGRES_DB: homebell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d homebell_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-ci.mjs
        env:
          CI_ADMIN_URL: postgresql://postgres:ci-disposable-database@127.0.0.1:5432/homebell_test
      - run: pnpm db:migrate
        env:
          ENV_FILE: .env.test
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build:web
      - run: pnpm typecheck:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: openssl req -x509 -newkey rsa:2048 -nodes -keyout .local/localhost.key -out .local/localhost.pem -days 1 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - run: pnpm test:browser
