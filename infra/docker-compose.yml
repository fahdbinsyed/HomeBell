# Local development dependencies (needed from Phase 2). Usage: docker compose -f infra/docker-compose.yml up -d
# Credentials below are local-only development values; never reuse them elsewhere.
name: homebell-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homebell
      POSTGRES_USER: homebell_owner
      POSTGRES_PASSWORD: homebell_local_dev
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homebell_owner -d homebell']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  pg-data:
  redis-data:
