services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set a generated local password}
      POSTGRES_DB: homebell
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homebell"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["127.0.0.1:56379:56379"]
    volumes:
      ["./.local/redis-container.conf:/usr/local/etc/redis/redis.conf:ro"]
volumes:
  postgres-data:
